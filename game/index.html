<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Solmar Bay — Sun, Sand &amp; Sirens (3D)</title>
    <link rel="icon" href="data:," />
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        overflow: hidden; background: #0b0e14;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        color: #fff; user-select: none;
      }
      #game { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: crosshair; }
      #hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
      #hud .screen, #hud .btn, #hud .radio-btn, #hud .crew-btn { pointer-events: auto; }
      .hidden { display: none !important; }

      /* Filmic vignette over the 3D view. */
      #vignette {
        position: fixed; inset: 0; pointer-events: none; z-index: 4;
        background: radial-gradient(ellipse at center, transparent 60%, rgba(12, 6, 22, 0.45) 100%);
      }

      .hud-panel {
        position: absolute; background: rgba(8, 10, 18, 0.74);
        border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 8px;
        padding: 10px 12px; backdrop-filter: blur(2px);
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
      }

      /* While a full screen (title / pause / help / busted) is up, the
         HUD panels hide so the screen reads clean. */
      #hud.has-screen > *:not(.screen) { display: none; }

      /* Mission panel, top-left. */
      .mission-panel { top: 14px; left: 14px; width: 302px; border-left: 4px solid #ffd23f; }
      .mission-name { font-size: 17px; font-weight: 800; letter-spacing: 0.5px; }
      .mission-stage { font-size: 11px; color: #ffd23f; font-weight: 700; letter-spacing: 1px; margin-top: 2px; }
      .mission-obj { font-size: 13px; color: #e8e8e8; margin-top: 6px; line-height: 1.35; }
      .mission-timer { font-size: 15px; font-weight: 800; color: #ff5a4e; margin-top: 5px; }
      .mission-next { font-size: 11px; color: #9fd8ff; margin-top: 4px; letter-spacing: 0.5px; }

      /* Dispatch list, left under the mission panel. */
      .dispatch-panel { top: 172px; left: 14px; width: 302px; }
      .dispatch-title { font-size: 12px; font-weight: 800; letter-spacing: 1.5px; color: #7db8ff; }
      .dispatch-count { font-size: 11px; color: #ffb3ab; font-weight: 700; margin-top: 2px; }
      .dispatch-list { margin-top: 6px; }
      .dispatch-row { display: flex; justify-content: space-between; font-size: 12px; padding: 2px 0; border-top: 1px solid rgba(255,255,255,0.07); }
      .dispatch-row .dc { font-weight: 700; color: #fff; width: 92px; }
      .dispatch-row .dr { color: #ff9a8a; flex: 1; text-align: center; font-weight: 700; font-size: 11px; }
      .dispatch-row .dd { color: #cfe3ff; width: 52px; text-align: right; }

      /* Top-right cluster. */
      .top-right { position: absolute; top: 14px; right: 16px; text-align: right; }
      .cash { font-size: 30px; font-weight: 900; color: #7ddb52; text-shadow: 0 2px 8px rgba(0,0,0,0.7); line-height: 1; }
      .clock { font-size: 15px; font-weight: 700; color: #fff; margin-top: 4px; text-shadow: 0 1px 4px rgba(0,0,0,0.8); }
      .stars { font-size: 24px; letter-spacing: 3px; margin-top: 2px; text-shadow: 0 2px 6px rgba(0,0,0,0.8); }
      .stars span { color: rgba(255,255,255,0.28); }
      .stars span.lit { color: #ffd23f; }
      .rank { font-size: 11px; font-weight: 800; letter-spacing: 1px; color: #ffd23f; margin-top: 6px; }
      .xpbar { width: 170px; height: 6px; background: rgba(255,255,255,0.18); border-radius: 3px; margin-top: 4px; margin-left: auto; overflow: hidden; }
      .xpfill { height: 100%; background: linear-gradient(90deg, #ffd23f, #ff9a3d); width: 0%; }
      .respect { font-size: 11px; font-weight: 800; letter-spacing: 1px; color: #ff9ad5; margin-top: 5px; text-shadow: 0 1px 4px rgba(0,0,0,0.8); }

      /* Radio ticker, top-centre. */
      .radio { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); text-align: center; text-shadow: 0 1px 4px rgba(0,0,0,0.8); }
      .radio-name { font-size: 13px; font-weight: 800; letter-spacing: 2px; color: #ff9ad5; }
      .radio-track { font-size: 12px; color: #eee; }
      .radio-hint { font-size: 10px; color: #bbb; letter-spacing: 0.5px; margin-top: 2px; }
      .radio-btn {
        position: absolute; left: -34px; top: -2px; width: 26px; height: 26px;
        border-radius: 50%; border: 1px solid rgba(255,255,255,0.4);
        background: rgba(255, 154, 213, 0.25); color: #fff; font-size: 14px;
        cursor: pointer; line-height: 1;
      }
      .radio-btn:hover { background: rgba(255, 154, 213, 0.5); }

      /* Weapon slots, right. */
      .weapon-panel { position: absolute; top: 172px; right: 16px; display: flex; flex-direction: column; gap: 6px; }
      .weapon-slot {
        display: flex; align-items: center; gap: 8px; min-width: 172px;
        background: rgba(8, 10, 18, 0.66); border: 1px solid rgba(255,255,255,0.12);
        border-radius: 6px; padding: 7px 10px;
      }
      .weapon-slot.active { border-color: #ffd23f; background: rgba(60, 48, 8, 0.78); }
      .weapon-num { font-size: 11px; font-weight: 800; color: #ffd23f; background: rgba(255,255,255,0.1); border-radius: 4px; padding: 2px 6px; }
      .weapon-name { font-size: 12px; font-weight: 700; flex: 1; }
      .weapon-ammo { font-size: 13px; font-weight: 800; color: #fff; }

      /* Crew abilities, right under the weapons. */
      .crew-panel { position: absolute; top: 428px; right: 16px; width: 196px; }
      .crew-title { font-size: 10px; font-weight: 800; letter-spacing: 1.5px; color: #9fd8ff; text-align: right; margin-bottom: 5px; text-shadow: 0 1px 4px rgba(0,0,0,0.8); }
      .crew-btn {
        position: relative; display: flex; align-items: center; gap: 7px; width: 100%;
        background: rgba(8, 10, 18, 0.66); border: 1px solid rgba(255,255,255,0.12);
        border-radius: 6px; padding: 7px 10px; color: #fff; cursor: pointer;
        margin-bottom: 5px; overflow: hidden; font-family: inherit;
      }
      .crew-btn.ready { border-color: #7ddb52; }
      .crew-btn.cooling { border-color: rgba(255,255,255,0.12); opacity: 0.75; }
      .crew-cd { position: absolute; inset: 0; pointer-events: none; }
      .crew-num { font-size: 11px; font-weight: 800; color: #7ddb52; background: rgba(255,255,255,0.1); border-radius: 4px; padding: 2px 6px; position: relative; }
      .crew-name { font-size: 11px; font-weight: 700; flex: 1; text-align: left; position: relative; }
      .crew-state { font-size: 10px; font-weight: 800; color: #ffd23f; position: relative; }

      /* Race HUD, top-centre under the radio. */
      .race-panel { position: absolute; top: 86px; left: 50%; transform: translateX(-50%); text-align: center; }
      .race-count { font-size: 72px; font-weight: 900; color: #ffd23f; text-shadow: 0 4px 18px rgba(0,0,0,0.9); line-height: 1; }
      .race-pos { font-size: 34px; font-weight: 900; color: #fff; text-shadow: 0 3px 12px rgba(0,0,0,0.9); }
      .race-pos.leading { color: #7ddb52; }
      .race-info { font-size: 12px; font-weight: 700; letter-spacing: 1px; color: #ffd23f; margin-top: 2px; text-shadow: 0 1px 4px rgba(0,0,0,0.9); }

      /* Respect toast. */
      .toast {
        position: absolute; top: 64px; left: 50%; transform: translateX(-50%);
        font-size: 14px; font-weight: 800; letter-spacing: 1px; color: #ff9ad5;
        background: rgba(8, 10, 18, 0.7); border: 1px solid rgba(255, 154, 213, 0.4);
        padding: 6px 14px; border-radius: 8px; text-shadow: 0 1px 4px rgba(0,0,0,0.8);
      }

      /* Bottom-left: minimap + vitals. */
      .bottom-left { position: absolute; left: 16px; bottom: 16px; }
      .minimap-wrap { width: 200px; height: 200px; }
      .minimap { width: 200px; height: 200px; display: block; }
      .district { font-size: 21px; font-weight: 900; letter-spacing: 0.5px; margin-top: 8px; text-shadow: 0 2px 6px rgba(0,0,0,0.85); }
      .district-sub { font-size: 11px; letter-spacing: 2px; color: #ffd23f; font-weight: 700; }
      .vitals { margin-top: 8px; width: 220px; }
      .bar { height: 9px; background: rgba(255,255,255,0.16); border-radius: 4px; overflow: hidden; }
      .bar-fill { height: 100%; }
      .bar-fill.hp { background: linear-gradient(90deg, #57d977, #2fae4e); }
      .bar-fill.arm { background: linear-gradient(90deg, #6db9ff, #2f7fd0); }
      .bar-fill.cond { background: linear-gradient(90deg, #ffd23f, #ff9a3d); }
      .bar-fill.nitro { background: linear-gradient(90deg, #6db9ff, #b44dff); }
      .bar-fill.prog { background: linear-gradient(90deg, #ff9ad5, #ff5a8a); }
      .bar-fill.turf { background: linear-gradient(90deg, #3fd96a, #1fae54); }
      .bar-text { font-size: 10px; font-weight: 700; letter-spacing: 1px; color: #ddd; margin: 3px 0 6px; text-shadow: 0 1px 3px rgba(0,0,0,0.9); }
      .nitro-text { color: #b9a5ff; }

      /* Bottom-right: speedometer. */
      .bottom-right { position: absolute; right: 18px; bottom: 16px; text-align: right; }
      .speed { font-size: 54px; font-weight: 900; line-height: 0.95; text-shadow: 0 3px 10px rgba(0,0,0,0.8); }
      .speed-unit { font-size: 12px; font-weight: 800; letter-spacing: 2px; color: #ffd23f; }
      .car-name { font-size: 15px; font-weight: 800; margin-top: 6px; text-shadow: 0 1px 4px rgba(0,0,0,0.8); }
      .cond-bar { width: 190px; margin-top: 5px; margin-left: auto; }
      .nitro-bar { width: 190px; margin-top: 5px; margin-left: auto; }

      /* Dialogue, bottom-centre. */
      .dialogue {
        position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%);
        width: 520px; max-width: 46vw; background: rgba(8, 10, 18, 0.82);
        border: 1px solid rgba(255,255,255,0.16); border-radius: 10px; padding: 12px 16px;
      }
      .dialogue-name { font-size: 12px; font-weight: 800; letter-spacing: 1.5px; color: #ffd23f; }
      .dialogue-text { font-size: 15px; line-height: 1.4; margin-top: 4px; }

      /* Centre banner. */
      .banner { position: absolute; top: 30%; left: 50%; transform: translate(-50%, -50%); text-align: center; text-shadow: 0 4px 18px rgba(0,0,0,0.9); }
      .banner-title { font-size: 58px; font-weight: 900; letter-spacing: 3px; color: #7ddb52; }
      .banner.fail .banner-title { color: #ff5a4e; }
      .banner-sub { font-size: 20px; font-weight: 700; color: #fff; margin-top: 4px; }

      .crosshair {
        position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
        font-size: 18px; color: rgba(255,255,255,0.85); text-shadow: 0 0 6px #000;
      }
      .hint {
        position: absolute; left: 50%; bottom: 120px; transform: translateX(-50%);
        font-size: 13px; color: #ffe9a8; text-shadow: 0 1px 4px rgba(0,0,0,0.9);
        background: rgba(0,0,0,0.35); padding: 5px 12px; border-radius: 6px;
      }
      .hint:empty { display: none; }

      /* Weapon wheel overlay. */
      .wheel {
        position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
        width: 380px; height: 380px; border-radius: 50%;
        background: radial-gradient(circle, rgba(8, 10, 18, 0.55) 0%, rgba(8, 10, 18, 0.15) 70%);
        border: 1px solid rgba(255,255,255,0.18);
      }
      .wheel-centre {
        position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
        font-size: 13px; font-weight: 800; letter-spacing: 3px; color: #ffd23f;
      }
      .wheel-seg {
        position: absolute; transform: translate(-50%, -50%); text-align: center;
        background: rgba(8, 10, 18, 0.8); border: 1px solid rgba(255,255,255,0.2);
        border-radius: 8px; padding: 8px 12px; min-width: 96px;
      }
      .wheel-seg.active { border-color: #ffd23f; background: rgba(60, 48, 8, 0.9); }
      .wheel-seg.hover { border-color: #7db8ff; box-shadow: 0 0 14px rgba(125, 184, 255, 0.5); }
      .wheel-seg-name { font-size: 13px; font-weight: 800; }
      .wheel-seg-ammo { font-size: 11px; color: #ffd23f; font-weight: 700; margin-top: 2px; }
      .wheel-hint {
        position: absolute; left: 50%; bottom: -32px; transform: translateX(-50%);
        font-size: 12px; color: #ccc; white-space: nowrap; text-shadow: 0 1px 4px rgba(0,0,0,0.9);
      }

      /* Garage shop. `.screen.garage` beats the later `.screen` rule
         on specificity, so the panel starts at the top instead of
         centering and overflowing past both edges. Compact rows so
         all eight fit in 720px with the title and the close button. */
      .screen.garage { background: linear-gradient(180deg, rgba(10, 20, 14, 0.88) 0%, rgba(8, 10, 18, 0.92) 100%); justify-content: flex-start; padding-top: 16px; overflow-y: auto; }
      .screen.garage .screen-title { font-size: 34px; }
      .screen.garage .screen-sub { margin-top: 2px; }
      .screen.garage .title-btns { margin-top: 8px; }
      .garage-cash { font-size: 22px; font-weight: 900; color: #7ddb52; margin-top: 4px; }
      .garage-rows { width: 640px; max-width: 88vw; margin-top: 6px; display: flex; flex-direction: column; gap: 5px; }
      .garage-row {
        display: flex; align-items: center; gap: 12px; text-align: left;
        background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14);
        border-radius: 8px; padding: 5px 14px;
      }
      .garage-swatch { width: 28px; height: 28px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.4); flex-shrink: 0; }
      .garage-info { flex: 1; }
      .garage-label { font-size: 14px; font-weight: 800; letter-spacing: 0.5px; }
      .garage-desc { font-size: 12px; color: #ccc; margin-top: 2px; }
      .garage-level { font-size: 11px; color: #ffd23f; font-weight: 700; margin-top: 2px; }
      .garage-buy { font-size: 14px; padding: 9px 18px; min-width: 92px; }
      .garage-buy:disabled { opacity: 0.5; cursor: default; }
      .garage-msg { font-size: 14px; font-weight: 700; color: #ffd23f; margin-top: 8px; min-height: 18px; }

      /* Progression panel on the pause screen. */
      .prog-panel { width: 420px; max-width: 86vw; margin-top: 20px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); border-radius: 10px; padding: 14px 18px; text-align: left; }
      .prog-rank { font-size: 15px; font-weight: 800; letter-spacing: 1px; color: #ff9ad5; }
      .prog-bar { margin-top: 8px; }
      .prog-next { font-size: 12px; color: #ccc; margin-top: 6px; }
      .turf-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
      .turf-name { font-size: 12px; font-weight: 800; width: 96px; letter-spacing: 0.5px; }
      .turf-bar { flex: 1; }
      .turf-val { font-size: 12px; font-weight: 800; color: #3fd96a; width: 40px; text-align: right; }

      /* Full screens. */
      .screen {
        position: absolute; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; text-align: center;
        background: linear-gradient(180deg, rgba(20, 8, 30, 0.32) 0%, rgba(10, 6, 20, 0.52) 100%);
        z-index: 10; padding: 24px;
      }
      .title-kicker { font-size: 13px; letter-spacing: 4px; font-weight: 800; color: #ffd23f; }
      .title-main {
        font-size: 84px; font-weight: 900; letter-spacing: 4px; line-height: 1;
        margin-top: 10px;
        background: linear-gradient(180deg, #fff 20%, #ffd23f 55%, #ff7a3d 100%);
        -webkit-background-clip: text; background-clip: text; color: transparent;
        text-shadow: 0 6px 30px rgba(0,0,0,0.4);
      }
      .title-sub { font-size: 26px; font-weight: 800; letter-spacing: 8px; color: #fff; margin-top: 6px; }
      .title-tag { font-size: 14px; color: #ddd; max-width: 560px; margin-top: 14px; line-height: 1.5; }
      .title-btns { display: flex; gap: 12px; margin-top: 26px; }
      .btn {
        cursor: pointer; font-size: 16px; font-weight: 800; letter-spacing: 1px;
        padding: 13px 30px; border-radius: 8px; border: 2px solid rgba(255,255,255,0.5);
        background: rgba(255,255,255,0.08); color: #fff;
      }
      .btn.primary { background: #ff5a3d; border-color: #ff5a3d; }
      .btn:hover { filter: brightness(1.15); }
      .title-controls { font-size: 13px; color: #bbb; margin-top: 26px; }
      .title-foot { font-size: 12px; color: #ffd23f; letter-spacing: 1px; margin-top: 10px; font-weight: 700; }
      .screen-title { font-size: 52px; font-weight: 900; letter-spacing: 3px; }
      .screen-sub { font-size: 16px; color: #ddd; margin-top: 8px; }
      .help-body { font-size: 15px; line-height: 1.9; color: #eee; margin-top: 18px; text-align: left; }
      .busted-title { font-size: 88px; font-weight: 900; letter-spacing: 6px; color: #7db8ff; text-shadow: 0 0 40px rgba(80, 140, 255, 0.6); }

      #gl-error {
        position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
        background: #0b0e14; color: #fff; font-size: 18px; z-index: 50; text-align: center; padding: 24px;
      }
      #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    </style>
  </head>
  <body>
    <canvas id="game" width="1280" height="720"></canvas>
    <div id="vignette"></div>
    <div id="hud"></div>
    <div id="gl-error">This game needs WebGL. Please use a desktop browser with hardware acceleration enabled.</div>
    <div id="status" role="status" aria-live="polite"></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
